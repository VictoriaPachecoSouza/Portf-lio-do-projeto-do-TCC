<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sou o chatArais, seu assistente virtual!</title>
    <link rel="stylesheet" href="estilo.css">
     <style>
        /* =========================================================
           CHATBOT - BOTÃO DO ROBÔ
        ========================================================= */

        .btn-abrir-chat-principal {
            position: fixed;
            bottom: 20px;
            right: 20px;

            background-color: #5cb82a;

            border: none;

            width: 70px;
            height: 70px;

            border-radius: 50%;

            cursor: pointer;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: transform 0.2s, background-color 0.2s;

            padding: 0;
        }

        .btn-abrir-chat-principal:hover {
            background-color: #4da31f;
            transform: scale(1.08);
        }

        .btn-abrir-chat-principal svg {
            width: 58px;
            height: 58px;
        }


        /* =========================================================
           JANELA DO CHAT
           TAMANHO FIXO: 300 X 380
        ========================================================= */

        .chatbot-principal {
            position: fixed;

            width: 300px;
            height: 380px;

            right: 20px;
            bottom: 100px;

            background: #242424;

            border-radius: 14px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);

            overflow: hidden;

            display: none;

            flex-direction: column;

            z-index: 10000;
        }


        /* =========================================================
           CABEÇALHO
        ========================================================= */

        .chatbot-header {
            height: 55px;

            padding: 10px 12px;

            background: #5cb82a;

            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            flex-shrink: 0;
        }

        .chatbot-header strong {
            display: block;

            font-size: 16px;

            font-family: Arial, sans-serif;
        }

        .chatbot-header small {
            display: block;

            margin-top: 2px;

            font-size: 11px;

            font-family: Arial, sans-serif;
        }


        /* =========================================================
           BOTÃO FECHAR
        ========================================================= */

        .chatbot-fechar {
            width: 30px;
            height: 30px;

            border: none;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.15);

            color: white;

            font-size: 22px;

            line-height: 30px;

            cursor: pointer;

            padding: 0;
        }

        .chatbot-fechar:hover {
            background: rgba(0, 0, 0, 0.3);
        }


        /* =========================================================
           ÁREA DAS MENSAGENS
        ========================================================= */

        .chatbot-mensagens {
            flex: 1;

            min-height: 0;

            padding: 12px;

            overflow-y: auto;

            background: #303030;

            font-family: Arial, sans-serif;
        }


        /* =========================================================
           BARRA DE ROLAGEM
        ========================================================= */

        .chatbot-mensagens::-webkit-scrollbar {
            width: 5px;
        }

        .chatbot-mensagens::-webkit-scrollbar-track {
            background: #292929;
        }

        .chatbot-mensagens::-webkit-scrollbar-thumb {
            background: #5cb82a;
            border-radius: 10px;
        }


        /* =========================================================
           MENSAGENS
        ========================================================= */

        .mensagem {
            max-width: 85%;

            padding: 8px 10px;

            margin-bottom: 9px;

            border-radius: 9px;

            font-size: 12px;

            line-height: 1.4;

            color: white;

            word-wrap: break-word;
        }

        .mensagem span {
            display: block;

            font-size: 10px;

            font-weight: bold;

            margin-bottom: 3px;
        }


        /* MENSAGEM DO BOT */

        .mensagem.bot {
            background: #3b3b3b;

            border-bottom-left-radius: 3px;
        }

        .mensagem.bot span {
            color: #5cb82a;
        }


        /* MENSAGEM DO USUÁRIO */

        .mensagem.usuario {
            margin-left: auto;

            background: #5cb82a;

            border-bottom-right-radius: 3px;
        }

        .mensagem.usuario span {
            color: white;
        }


        /* =========================================================
           ÁREA DO INPUT
        ========================================================= */

        .chatbot-input-area {
            height: 52px;

            padding: 8px;

            display: flex;

            gap: 6px;

            background: #242424;

            border-top: 1px solid #444;

            flex-shrink: 0;
        }


        /* INPUT */

        .chatbot-input {
            flex: 1;

            min-width: 0;

            height: 36px;

            padding: 0 9px;

            border-radius: 7px;

            border: 1px solid #555;

            outline: none;

            background: #333;

            color: white;

            font-size: 12px;

            font-family: Arial, sans-serif;
        }

        .chatbot-input::placeholder {
            color: #aaa;
        }

        .chatbot-input:focus {
            border-color: #5cb82a;
        }


        /* =========================================================
           BOTÃO ENVIAR
        ========================================================= */

        .chatbot-enviar {
            height: 36px;

            padding: 0 10px;

            border: none;

            border-radius: 7px;

            background: #5cb82a;

            color: white;

            font-size: 11px;

            font-weight: bold;

            cursor: pointer;
        }

        .chatbot-enviar:hover {
            background: #4da31f;
        }


        /* =========================================================
           RESPONSIVO
        ========================================================= */

        @media (max-width: 450px) {

            .chatbot-principal {
                width: 300px;
                height: 380px;

                right: 10px;
                bottom: 95px;
            }

            .btn-abrir-chat-principal {
                right: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>


</html>

<body>


    <!-- =========================================================
         MENU
    ========================================================= -->

    <!-- =========================================================
         ROBÔ
    ========================================================= -->

    <button class="btn-abrir-chat-principal" onclick="alternarChat()" aria-label="Abrir Chatbot">


        <svg viewBox="0 0 512 512">
            <!-- Corpo e Pescoço -->
            <path d="M256 310v35h20v-35z" fill="#e1f5fe" />
            <path d="M236 310v35h20v-35z" fill="#b3e5fc" />
            <path d="M256 328c-71.8 0-130 58.2-130 130v54h130V328z" fill="#e1f5fe" />
            <path d="M256 328v184h130v-54c0-71.8-58.2-130-130-130z" fill="#90caf9" />
            <!-- Cabeça Externa -->
            <path d="M256 81c-82.3 0-142 55.4-142 110.5s59.7 110.5 142 110.5z" fill="#e1f5fe" />
            <path d="M256 81v221c82.3 0 142-55.4 142-110.5S338.3 81 256 81z" fill="#b3e5fc" />
            <!-- Visor Escuro -->
            <path d="M256 125c-54.1 0-98 29.5-98 66s43.9 66 98 66z" fill="#1a0066" />
            <path d="M256 125v132c54.1 0 98-29.5 98-66s-43.9-66-98-66z" fill="#12004d" />
            <!-- Olhos Verdes -->
            <path d="M210 143h16v40h-16z" fill="#5cb82a" />
            <path d="M278 143h16v40h-16z" fill="#4da31f" />
            <!-- Sorriso Verde -->
            <path d="M214 209c0 10.5 18.8 19 42 19v-19z" fill="#5cb82a" />
            <path d="M256 209v19c23.2 0 42-8.5 42-19z" fill="#4da31f" />
            <!-- Orelhas/Fones Laterais -->
            <path d="M116 172c-15.5 0-28 11.2-28 25s12.5 25 28 25z" fill="#311b92" />
            <path d="M116 172v50c6.6 0 12-11.2 12-25s-5.4-25-12-25z" fill="#90caf9" />
            <path d="M396 172v50c15.5 0 28-11.2 28-25s-12.5-25-28-25z" fill="#1a0066" />
            <path d="M396 172c-6.6 0-12 11.2-12 25s5.4 25 12 25z" fill="#64b5f6" />
            <!-- Microfone do Headset -->
            <path d="M394 235c0 23.2-18.8 42-42 42h-40v-14h40c15.5 0 28-12.5 28-28z" fill="#1a0066" />
            <path d="M312 263c-12.2 0-22 9.8-22 22s9.8 22 22 22 22-9.8 22-22-9.8-22-22-22z" fill="#1a0066" />
        </svg>

    </button>



    <!-- =========================================================
         CHATBOT
         DIRETAMENTE NESTA PÁGINA
    ========================================================= -->

    <div class="chatbot-principal" id="chatbotPrincipal">


        <!-- CABEÇALHO -->

        <div class="chatbot-header">

            <div>

                <strong>chatArais</strong>

                <small>Assistente virtual 🌱</small>

            </div>


            <button class="chatbot-fechar" onclick="fecharChat()" aria-label="Fechar chatbot">

                ×

            </button>

        </div>



        <!-- MENSAGENS -->

        <div class="chatbot-mensagens" id="chatbotMensagens">


            <div class="mensagem bot">

                <span>Bot</span>

                Olá! 👋 Como posso ajudar você?

            </div>

        </div>



        <!-- INPUT -->

        <div class="chatbot-input-area">

            <input type="text" id="chatbotInput" class="chatbot-input" placeholder="Digite sua mensagem..."
                autocomplete="off">


            <button class="chatbot-enviar" onclick="enviarMensagem()">

                Enviar

            </button>

        </div>

    </div>



    <!-- =========================================================
         JAVASCRIPT DO CHATBOT
    ========================================================= -->

    <script>

        /* =====================================================
           ABRIR / FECHAR CHAT
        ===================================================== */

        function alternarChat() {

            const chat =
                document.getElementById("chatbotPrincipal");


            if (chat.style.display === "flex") {

                chat.style.display = "none";

            } else {

                chat.style.display = "flex";

                document
                    .getElementById("chatbotInput")
                    .focus();

            }

        }


        /* =====================================================
           FECHAR CHAT
        ===================================================== */

        function fecharChat() {

            document
                .getElementById("chatbotPrincipal")
                .style.display = "none";

        }


        /* =====================================================
           ADICIONAR MENSAGEM
        ===================================================== */

        function adicionarMensagem(texto, tipo) {

            const mensagens =
                document.getElementById("chatbotMensagens");


            const mensagem =
                document.createElement("div");


            mensagem.className =
                "mensagem " + tipo;


            const nome =
                document.createElement("span");


            if (tipo === "bot") {

                nome.textContent = "Bot";

            } else {

                nome.textContent = "Você";

            }


            mensagem.appendChild(nome);


            const conteudo =
                document.createTextNode(texto);


            mensagem.appendChild(conteudo);


            mensagens.appendChild(mensagem);


            mensagens.scrollTop =
                mensagens.scrollHeight;

        }


        /* =====================================================
           RESPOSTAS DO CHATBOT
        ===================================================== */

        function respostaBot(texto) {

            const mensagem =
                texto.toLowerCase();


            /* SAUDAÇÕES */

            if (
                mensagem.includes("oi") ||
                mensagem.includes("olá") ||
                mensagem.includes("ola")
            ) {

                return "Olá! 👋 Como posso ajudar você?";

            }


            /* BOM DIA */

            if (
                mensagem.includes("bom dia")
            ) {

                return "Bom dia! 🌱 Como posso ajudar?";

            }


            /* BOA TARDE */

            if (
                mensagem.includes("boa tarde")
            ) {

                return "Boa tarde! 🌱 Como posso ajudar?";

            }


            /* BOA NOITE */

            if (
                mensagem.includes("boa noite")
            ) {

                return "Boa noite! 🌙 Como posso ajudar?";

            }


            /* AJUDA */

            if (
                mensagem.includes("ajuda") ||
                mensagem.includes("suporte")
            ) {

                return "Claro! Estou aqui para ajudar com informações sobre o Solo em Equilíbrio. 🌱";

            }


            /* SOLO */

            if (
                mensagem.includes("solo")
            ) {

                return "O solo é muito importante para o equilíbrio do meio ambiente, para as plantas e para a produção de alimentos. 🌱";

            }


            /* PLANTAS */

            if (
                mensagem.includes("planta") ||
                mensagem.includes("plantas")
            ) {

                return "As plantas dependem de um solo saudável para crescer. Cuidar do solo também ajuda a preservar o meio ambiente. 🌿";

            }


            /* SUSTENTABILIDADE */

            if (
                mensagem.includes("sustentabilidade") ||
                mensagem.includes("sustentável")
            ) {

                return "A sustentabilidade busca utilizar os recursos naturais de forma responsável, pensando também nas futuras gerações. 🌎";

            }


            /* MEIO AMBIENTE */

            if (
                mensagem.includes("meio ambiente") ||
                mensagem.includes("ambiente")
            ) {

                return "Cuidar do meio ambiente envolve preservar o solo, a água, as plantas e os animais. 🌎🌱";

            }


            /* OBRIGADO */

            if (
                mensagem.includes("obrigado") ||
                mensagem.includes("obrigada")
            ) {

                return "De nada! 😊 Estou sempre aqui para ajudar.";

            }


            /* TCHAU */

            if (
                mensagem.includes("tchau") ||
                mensagem.includes("adeus")
            ) {

                return "Tchau! 👋 Até a próxima!";

            }


            /* RESPOSTA PADRÃO */

            return "Ainda estou aprendendo! 🤖 Tente perguntar sobre solo, plantas, sustentabilidade ou meio ambiente.";

        }


        /* =====================================================
           ENVIAR MENSAGEM
        ===================================================== */

        function enviarMensagem() {

            const input =
                document.getElementById("chatbotInput");


            const texto =
                input.value.trim();


            if (texto === "") {

                return;

            }


            /* MOSTRA MENSAGEM DO USUÁRIO */

            adicionarMensagem(
                texto,
                "usuario"
            );


            /* LIMPA INPUT */

            input.value = "";


            /* RESPOSTA DO BOT */

            setTimeout(function () {

                const resposta =
                    respostaBot(texto);


                adicionarMensagem(
                    resposta,
                    "bot"
                );

            }, 500);

        }


        /* =====================================================
           ENTER PARA ENVIAR
        ===================================================== */

        document
            .getElementById("chatbotInput")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {

                        enviarMensagem();

                    }

                }
            );

    </script>


    <!-- SEU SCRIPT ORIGINAL -->

    <script src="script.js"></script>

</body>

</html>
