<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa tragetória</title>
    <!-- Arquivos externos -->
    <link rel="stylesheet" type="text/css" href="estilo.css" />
    <script src="botaoes.js" defer></script>
</head>

<body>

    <nav>
        <div class="logo">
            <img src="Logotipo.png" height="50" alt="Logotipo">
        </div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>

        <ul class="menu" id="menu">
            <li><a href="#">Início</a></li>
            <li><a href="#TiposPlantas">Plantas</a></li>
            <li><a href="#Kanban">Kanban</a></li>
            <li><a href="#Equipe">Equipe</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>

        <div class="darkLight-searchBox">

            <div class="dark-light">

                <!-- LUA -->
                <svg class="moon" viewBox="0 0 24 24">
                    <path
                        d="M12 11.807A9.002 9.002 0 0 1 10.049 2a9.944 9.944 0 0 0-5.244 2.193C.961 7.472.71 13.568 4.212 17.07c3.5 3.5 9.597 3.25 12.877-.594A9.943 9.943 0 0 0 19.28 11.23a9.006 9.006 0 0 1-7.28.577z" />
                </svg>


                <!-- SOL -->
                <svg class="sun" viewBox="0 0 100 100" fill="none" stroke="#FFFFFF" stroke-width="7"
                    stroke-linecap="square">

                    <circle cx="50" cy="50" r="22" />

                    <g>
                        <line x1="50" y1="8" x2="50" y2="18" />
                        <line x1="50" y1="82" x2="50" y2="92" />

                        <line x1="8" y1="50" x2="18" y2="50" />
                        <line x1="82" y1="50" x2="92" y2="50" />

                        <line x1="20.5" y1="20.5" x2="27.5" y2="27.5" />
                        <line x1="72.5" y1="72.5" x2="79.5" y2="79.5" />

                        <line x1="20.5" y1="79.5" x2="27.5" y2="72.5" />
                        <line x1="72.5" y1="27.5" x2="79.5" y2="20.5" />
                    </g>

                </svg>

            </div>

        </div>
    </nav>

    <h1 class="titulo-trajetoria">
        Nossa <span class="destaque">Trajetória</span>
    </h1>

    <h3>Conheça toda a nossa trajetória até aqui</h3>

    <style>
        /* MODO ESCURO */
        .titulo-trajetoria {
            color: #ffffff;
            /* "Nossa" fica branco */
        }

        .titulo-trajetoria .destaque {
            color: #556B2F;
            /* "Trajetória" continua verde */
        }

        /* MODO CLARO */
        body.dark .titulo-trajetoria {
            color: #000000;
            /* "Nossa" fica preto */
        }

        body.dark .titulo-trajetoria .destaque {
            color: #556B2F;
            /* "Trajetória" continua verde */
        }
    </style>

    <strong>Agradecemos a leitura.</strong>
































    <!-- Script Isolado e Funcional -->
    <script>
        const body = document.querySelector("body"),
            modeToggle = document.querySelector(".dark-light"),
            searchToggle = document.querySelector(".searchToggle");

        // Código do clique para o Modo Escuro
        modeToggle.addEventListener("click", () => {
            modeToggle.classList.toggle("active");
            body.classList.toggle("dark");
        });

        // Alterna o estado ativo do botão de pesquisa ao clicar
        searchToggle.addEventListener("click", () => {
            searchToggle.classList.toggle("active");
        });
    </script>


    <style>
        /* =============================
   MODO ESCURO / CLARO INVERTIDO
================================ */

        /* MODO ESCURO - padrão */
        body {
            background-color: #0d1117;
            color: #ffffff;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Elementos no modo escuro */
        body .main-title,
        body .plantas-title,
        body .kanban-title,
        body .equipe-title,
        body h2,
        body h3 {
            color: #ffffff;
        }


        /* ================================
   MODO CLARO
================================ */

        body.dark {
            background-color: #ffffff;
            color: #000000;
        }

        /* Textos no modo claro */
        body.dark .main-title,
        body.dark .plantas-title,
        body.dark .kanban-title,
        body.dark .equipe-title,
        body.dark h2,
        body.dark h3 {
            color: #000000;
        }

        /* TÍTULO SEMPRE BEM CENTRALIZADO */
        .main-title {
            text-align: center;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }

        /* Títulos no modo escuro */
        body .main-title,
        body .plantas-title,
        body .kanban-title,
        body .equipe-title,
        body h2,
        body h3 {
            color: #ffffff;
        }

        /* Textos secundários no modo claro */
        body.dark .description,
        body.dark .planta-card p,
        body.dark .kanban-card p,
        body.dark .profile-card .bio {
            color: #555555;
        }


        /* ================================
   CARDS
================================ */

        .planta-card,
        .profile-card,
        .kanban-column,
        .kanban-card {
            transition: background-color 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease;
        }


        /* Cards no modo escuro */
        .planta-card,
        .profile-card,
        .kanban-column {
            background-color: #161b22;
            border-color: #30363d;
        }

        .kanban-card {
            background-color: #21262d;
            border-color: #30363d;
        }


        /* Cards no modo claro */
        body.dark .planta-card,
        body.dark .profile-card,
        body.dark .kanban-column {
            background-color: #ffffff;
            border-color: #dddddd;
        }

        body.dark .kanban-card {
            background-color: #f8f9fa;
            border-color: #dddddd;
        }


        /* ================================
   LUA E SOL
================================ */

        .dark-light {
            position: relative;
            width: 40px;
            height: 40px;
            cursor: pointer;
        }

        /* Ícones */
        .dark-light .moon,
        .dark-light .sun {
            position: absolute;
            width: 25px;
            height: 25px;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        /* 🌙 MODO ESCURO = LUA */
        .dark-light .moon {
            opacity: 1;
        }

        .dark-light .sun {
            opacity: 0;
        }


        /* ☀️ MODO CLARO = SOL */
        body.dark .dark-light .moon {
            opacity: 0;
        }

        body.dark .dark-light .sun {
            opacity: 1;
        }

        .main-title {
            font-size: 44px;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        /* Texto descritivo */
        .description {
            font-size: 16px;
            line-height: 1.6;
            color: #8b949e;
            max-width: 800px;
            margin: 0 auto 40px auto;
            text-align: justify;
            /* Melhora a leitura de textos longos */
        }

        /* Container dos botões */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* Estilo base dos botões */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s, transform 0.2s;
        }

        /* Botão verde (Principal) */
        .btn-primary {
            background-color: #1f883d;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
        }

        .btn-primary:hover {
            background-color: #2ea44f;
        }

        /* Botão escuro (Secundário) */
        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-secondary:hover {
            background-color: #30363d;
            color: #ffffff;
        }

        /* Subtítulo superior pequeno */
        .category-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .category-title::after {
            content: " ■";
            color: #2ea44f;
            /* Quadrado verde */
        }

        /* Container da seção Hero */
        .hero-section {
            max-width: 900px;
            width: 100%;
            margin: 60px auto;
            text-align: center;
        }
    </style>
    </head>








</body>

</html>
